name: CI

on:
  push:
    branches:
      - main
      - Main
  pull_request:

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          PYTHONPATH=src pytest

  docker-build:
    name: Build and smoke test Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image with cache
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: banking-support-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker container
        run: |
          docker run -d --name banking-support-agent-ci -p 8000:8000 banking-support-agent:ci

      - name: Smoke test Docker API
        run: |
          sleep 5
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/ui

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker logs banking-support-agent-ci || true

      - name: Stop Docker container
        if: always()
        run: |
          docker rm -f banking-support-agent-ci || true